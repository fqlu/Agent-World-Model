# Drive Context Protocol — machine-readable manifest
# Mirrors SPEC.md §9. The linter consumes this file; SPEC.md is for humans.
spec_version: 0.10.0

# Topology is declarative (SPEC §2): each workspace declares its own layout in
# a root _Workspace.yaml; the linter validates against that declaration.
workspace:
  manifest_file: _Workspace.yaml
  rulebook_file: AGENTS.md             # cross-vendor agent auto-discovery standard
  required_root_files: [_Workspace.yaml, AGENTS.md, _Overview.md]     # ST-001
  optional_root_files: [_Index.md, _Model.json]  # generated artifacts (§6.5, §6.8), exempt from ST-004
  required_capabilities: [journal, templates, archive]                # ST-003
  optional_capabilities: [context, entities]                          # §6.4, §6.6
  areas_min: 1                                                        # ST-003
  protocol_synced_with_manifest: true                                 # ST-005
  # undeclared root items -> ST-004 (warn); profiles may whitelist files

scopes:
  # Content by default (SPEC §3): a folder is a scope only if it contains the
  # context file. Entities (depth-1 in an area) MUST be scopes; deeper folders
  # are promoted by choice. Overview content is free-form; the sections below
  # are recommendations read by tooling (index generator), not lint subjects.
  context_file: _Overview.md
  promotion: context_file_presence
  entity_overview_required: true     # SC-001 (entities only)
  optional_files: [_Tasks.md]
  recommended_sections:
    - "What it is"
    - "Active workstreams"
    - "Key people"
    - "Recent activity"
    - "Reference"

collections:
  wip_notes:
    suffix: " | WIP Notes"
    file_pattern: '^\d{4}-\d{2}-\d{2}\.md$'   # CL-001
    template: "WIP Note.md"
    required_sections: [Discussion, Decisions, Actions]   # CL-002, warn
  journal:
    # relative to the workspace's declared journal mount               # JR-001
    path_pattern: '^\d{4}/\d{4}-\d{2}/\d{4}-\d{2}-\d{2}\.md$'
    template: "Daily Journal.md"
    agent_activity_heading: "Agent activity"   # JR-003

context:
  default_mount: "_Context"      # also the context DIRECTORY NAME at every level
  per_folder: true               # any folder may hold a context directory
  template: "Context Group.md"
  required_frontmatter: [name, title, members]   # CX-001
  members: descendant_folder_paths               # relative to declaring folder; CX-002
  inheritance: down              # effective context = own + all ancestors'
  placement: lowest_common_ancestor              # guidance, not lint-enforced

entities:                        # §6.6 — the "cast" of the world model
  default_mount: "_Entities"     # workspace-root registry, one file per entity
  template: "Entity.md"
  kinds: [person, system, concept]
  required_frontmatter: [name, kind]             # EN-001
  provenance: [source, confirmed]                # derived|asserted, last-confirmed date
  derive_first: true             # extracted from overviews; human confirms/enriches

relationships:                   # §6.7 — the "edges" of the world model
  stored_in: entity_frontmatter  # relations: [{predicate, target, note}]
  predicates:                    # closed vocabulary (RL-001)
    - leads
    - owns
    - works-on
    - member-of
    - reports-to
    - uses
    - deployed-for
    - depends-on
    - related-to
  target: entity_slug_or_scope_path              # RL-002

projection:                      # §6.8 — generated world-model snapshot
  file: "_Model.json"
  derived: true                  # rebuilt from files; exempt from ST-004

naming:
  pipe_separator: " | "
  entity_no_pipes: true              # NM-003
  ancestry_prefix: short_name_aware  # NM-001; short name = trailing "(...)" of own segment
  iso_dates: true                    # NM-002
  context_file_prefix: "_"

archive:
  mirror_original_path: true         # AR-001
  delete_forbidden: true

templates:
  context_group: "Context Group.md"
  _Workspace.yaml: "_Workspace.yaml"
  _Overview.md: "_Overview.md"
  _Tasks.md: "_Tasks.md"
  wip_note: "WIP Note.md"
  journal_day: "Daily Journal.md"
  AGENTS.md: "AGENTS.md"

rules:
  - { id: ST-001, severity: error, summary: root has _Workspace.yaml + AGENTS.md + _Overview.md }
  - { id: ST-002, severity: error, summary: every declared mount exists }
  - { id: ST-003, severity: error, summary: capabilities mounted and >=1 area declared }
  - { id: ST-004, severity: warn,  summary: no undeclared root items }
  - { id: ST-005, severity: error, summary: AGENTS.md in sync with _Workspace.yaml }
  - { id: SC-001, severity: error, summary: every entity (depth-1 in area) has _Overview.md }
  - { id: CL-001, severity: error, summary: WIP notes named YYYY-MM-DD.md }
  - { id: CL-002, severity: warn,  summary: WIP note follows template sections }
  - { id: NM-001, severity: error, summary: promoted scopes/collections pipe-name mirrors ancestry }
  - { id: NM-002, severity: warn,  summary: promoted scopes use ISO dates in names }
  - { id: NM-003, severity: error, summary: entity names contain no pipes }
  - { id: TK-001, severity: warn,  summary: tasks follow open/done format }
  # removed in v0.6 (content-by-default): SC-002, SC-003, SC-004, OV-001, OV-002
  - { id: JR-001, severity: error, summary: journal path convention }
  - { id: JR-002, severity: info,  summary: journal is index not substance }
  - { id: JR-003, severity: warn,  summary: agent sessions journaled }
  - { id: AR-001, severity: error, summary: archive mirrors paths, no deletes }
  - { id: CX-001, severity: error, summary: context group files valid (name/title/members) }
  - { id: CX-002, severity: warn,  summary: context group member paths exist under declaring folder }
  - { id: EN-001, severity: error, summary: entity files valid (name + kind person/system/concept) }
  - { id: EN-002, severity: warn,  summary: entity slug matches filename }
  - { id: RL-001, severity: error, summary: relationship predicate in vocabulary }
  - { id: RL-002, severity: warn,  summary: relationship target resolves to entity or scope }

# Profiles layer org-specific rituals and template overrides onto the core
# protocol. Template overrides live in spec/templates/profiles/<profile>/ and
# fall back to the neutral base templates in spec/templates/.
profiles:
  core:
    # The organisation-neutral baseline: no draft lifecycle, no org rituals.
    default_topology:
      areas: [Projects]
      journal: Journal
      templates: Templates
      archive: Archive
      context: _Context
      entities: _Entities
    root_file_allowance: []
  incubeta:
    default_topology:           # starter, not law — workspaces may declare otherwise
      areas: [Clients, Internal]
      journal: Journal
      templates: Templates
      archive: Archive
      context: _Context
      entities: _Entities
    draft_lifecycle:
      working_prefix: "Draft_"
      production_prefixes: ["[INT]", "[EXT]"]
      sharing_only_from_production: true
    status_flags:
      production: "🟢"
      beta: "🟡"
      draft: "🟠"
      deprecated: "🔴"
    root_file_allowance: [CLAUDE.md]
    entity_reference_requires: [production_drive_folder_id]
    internal_solutions:
      path: Internal/Solutions
      naming: "Solutions | <Category> | <Platform>"

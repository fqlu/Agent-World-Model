# Workspace topology manifest — declares where the protocol's primitives are
# mounted in THIS workspace. The linter validates against this declaration;
# AGENTS.md's Map section is generated from it.
# Example shown with the generic "core" profile — declare whichever profile
# your organisation uses (e.g. "incubeta").
spec_version: 0.10.0
profile: core

owner:
  name: "{{owner_name}}"
  email: "{{owner_email}}"

mounts:
  # Scope-bearing folders (>=1, any names you like — Clients, Projects,
  # Research, Areas…)
  areas:
    - Projects
  # The three required capabilities — paths are yours to choose
  journal: Journal
  templates: Templates
  archive: Archive
  # Optional: context groups — declares the root context directory AND the
  # directory name any folder can use for its own level's groups
  context: _Context
  # Optional: entities — the "cast" (people, systems, concepts) as nodes
  entities: _Entities
